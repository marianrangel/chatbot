<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-left: 4px solid #e74c3c;
        }

        .feedback.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .links a:hover {
            color: #764ba2;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .loading.show {
            display: block;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .divider {
            text-align: center;
            color: #999;
            margin: 20px 0;
        }

        .guest-link {
            text-align: center;
        }

        .guest-link a {
            display: inline-block;
            padding: 12px 25px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .guest-link a:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <h1>🔐 Login</h1>
                <p>Acesse sua conta</p>
            </div>

            <div id="feedback" class="feedback"></div>
            <div id="loading" class="loading"></div>

            <form id="login-form" onsubmit="fazerLogin(event)">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                </div>

                <button type="submit" class="btn" id="login-btn">Entrar</button>
            </form>

            <div class="divider">OU</div>

            <div class="guest-link">
                <a href="index.html">Continuar como Visitante</a>
            </div>

            <div class="links">
                <p>Não tem conta? <a href="register.html">Registre-se aqui</a></p>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://chat-back-end-2.onrender.com';

        function exibirFeedback(mensagem, tipo = 'info') {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.textContent = mensagem;
            feedbackEl.className = `feedback show ${tipo}`;
        }

        function toggleLoading(mostrar = true) {
            const loadingEl = document.getElementById('loading');
            const btn = document.getElementById('login-btn');
            
            if (mostrar) {
                loadingEl.classList.add('show');
                loadingEl.textContent = 'Autenticando';
                btn.disabled = true;
            } else {
                loadingEl.classList.remove('show');
                btn.disabled = false;
            }
        }

        async function fazerLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                exibirFeedback('Por favor, preencha todos os campos', 'error');
                return;
            }

            try {
                toggleLoading(true);

                const response = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    exibirFeedback(data.error || 'Erro ao fazer login', 'error');
                    toggleLoading(false);
                    return;
                }

                // Salvar token e informações do usuário
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                exibirFeedback('✅ Login bem-sucedido! Redirecionando...', 'success');
                setTimeout(() => {
                    window.location.href = 'configuracoes.html';
                }, 1500);

            } catch (error) {
                console.error('Erro:', error);
                exibirFeedback('Erro de conexão com o servidor', 'error');
                toggleLoading(false);
            }
        }

        // Redirecionar se já está logado
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = 'configuracoes.html';
            }
        });
    </script>
</body>
</html>
