<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot com Histórico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { 
            display: flex; 
            gap: 20px; 
            width: 100%; 
            max-width: 1400px; 
            height: calc(100vh - 40px);
        }

        .chat-wrapper, .historico-wrapper { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        .chat-wrapper { 
            flex: 2; 
            display: flex; 
            flex-direction: column; 
        }

        .historico-wrapper { 
            flex: 1; 
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        #chat-container { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mensagem { 
            padding: 12px 16px; 
            border-radius: 18px; 
            max-width: 75%; 
            word-wrap: break-word;
            animation: fadeInUp 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .usuario { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end; 
            margin-left: auto;
        }

        .bot { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            align-self: flex-start;
        }

        .conteudo-mensagem {
            margin-bottom: 5px;
        }

        .conteudo-mensagem strong {
            display: block;
            margin-bottom: 5px;
            opacity: 0.9;
            font-size: 0.85rem;
        }

        .timestamp {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: right;
        }

        #input-container { 
            display: flex; 
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            gap: 12px;
        }

        #userInput { 
            flex-grow: 1; 
            padding: 15px; 
            border-radius: 25px; 
            border: 2px solid #e1e5e9;
            outline: none;
            font-size: 16px;
            resize: none;
            transition: border-color 0.3s ease;
        }

        #userInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #sendButton { 
            padding: 15px 25px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-width: 100px;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .historico-wrapper h2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            margin: 0;
            font-size: 1.3rem;
        }

        #lista-sessoes { 
            list-style: none; 
            padding: 0; 
            flex-grow: 1;
            overflow-y: auto;
        }

        #lista-sessoes li { 
            padding: 15px 20px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }

        #lista-sessoes li:hover { 
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            transform: translateX(5px);
        }

        #lista-sessoes li.active { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        #visualizacao-conversa-detalhada { 
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            min-height: 300px;
            overflow-y: auto;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            background: #fdf2f2;
            border: 1px solid #fbb;
            border-radius: 10px;
            padding: 10px;
        }

        .controls {
            padding: 15px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #f8f9fa;
            transform: translateY(-1px);
        }

        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }

        .welcome-message h3 {
            color: #333;
            margin-bottom: 10px;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 10px;
            }
            
            .chat-wrapper, .historico-wrapper {
                height: auto;
                min-height: 50vh;
            }
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Coluna do Chat Principal -->
        <div class="chat-wrapper">
            <div class="chat-header">
                <h1>Chatbot Principal</h1>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="limparChat()">🔄 Nova Conversa</button>
                <button class="btn" onclick="carregarHistoricos()">📜 Atualizar Históricos</button>
                <button class="btn" onclick="salvarHistoricoManual()">💾 Salvar Agora</button>
            </div>

            <div id="chat-container">
                <div class="welcome-message">
                    <h3>Bem-vindo ao Chatbot!</h3>
                    <p>Digite uma mensagem abaixo para começar nossa conversa.</p>
                </div>
            </div>
            
            <div id="input-container">
                <input type="text" id="userInput" placeholder="Digite sua mensagem...">
                <button id="sendButton">Enviar</button>
            </div>
        </div>

        <!-- Coluna do Histórico de Conversas -->
        <div class="historico-wrapper">
            <h2>Histórico de Conversas</h2>
            <ul id="lista-sessoes">
                <li class="loading">Carregando histórico...</li>
            </ul>
            <div id="visualizacao-conversa-detalhada">
                <p style="text-align: center; color: #666; padding: 20px;">
                    Selecione uma sessão acima para ver os detalhes da conversa.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Configurações globais
        const backendUrl = 'https://chat-back-end-2.onrender.com';
        let chatHistory = [];
        let currentSessionId = `sessao_${Date.now()}_${Math.random().toString(36).substring(7)}`;
        let chatStartTime = new Date();
        let messageCount = 0;

        // Função para obter IP do usuário
        async function obterIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.warn('Não foi possível obter IP:', error);
                return 'IP_DESCONHECIDO';
            }
        }

        // Função para registrar conexão do usuário
        async function registrarConexaoUsuario() {
            try {
                const userIP = await obterIP();
                const logData = {
                    ip: userIP,
                    acao: 'ACESSO_CHATBOT',
                    nomeBot: 'ChatBot-Principal-IFCODE'
                };

                const response = await fetch(`${backendUrl}/api/log-connection`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(logData)
                });

                if (response.ok) {
                    console.log('✅ Conexão registrada no log');
                } else {
                    console.warn('⚠️ Falha ao registrar conexão:', response.statusText);
                }
            } catch (error) {
                console.error('Erro ao registrar conexão:', error);
            }
        }

        // Salvar histórico da sessão
        async function salvarHistoricoSessao(sessionId, botId, startTime, endTime, messages) {
            try {
                if (!messages || messages.length === 0) {
                    console.log('📝 Nenhuma mensagem para salvar');
                    return;
                }

                const payload = {
                    sessionId,
                    botId,
                    startTime: startTime.toISOString(),
                    endTime: endTime.toISOString(),
                    messages
                };

                const response = await fetch(`${backendUrl}/api/chat/salvar-historico`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log(`💾 Histórico salvo: ${result.message}`);
                } else {
                    console.error("❌ Falha ao salvar histórico:", response.statusText);
                }
            } catch (error) {
                console.error("❌ Erro ao salvar histórico:", error);
            }
        }

        // Função principal para enviar mensagem
        async function enviarMensagem() {
            const inputUsuario = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            
            if (!inputUsuario) {
                console.error('❌ Input não encontrado!');
                return;
            }
            
            const mensagem = inputUsuario.value.trim();
            if (!mensagem) return;

            // Desabilita controles durante envio
            inputUsuario.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = 'Enviando...';

            // Limpa input e exibe mensagem do usuário
            inputUsuario.value = '';
            exibirMensagemUsuario(mensagem);

            try {
                // Envia para o backend
                const response = await fetch(`${backendUrl}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mensagem: mensagem,
                        historico: chatHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erro na requisição: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                
                if (data.erro) {
                    throw new Error(data.erro);
                }

                // Atualiza histórico e exibe resposta
                chatHistory = data.historico;
                messageCount++;
                exibirMensagemBot(data.resposta);

                // Salva histórico
                await salvarHistoricoSessao(
                    currentSessionId, 
                    "chatbotPrincipalIFCODE", 
                    chatStartTime, 
                    new Date(), 
                    chatHistory
                );

                console.log(`💬 Mensagem ${messageCount} processada`);

                // Atualiza lista de históricos
                setTimeout(carregarHistoricos, 1000);

            } catch (error) {
                console.error('❌ Erro ao enviar mensagem:', error);
                exibirMensagemBot(`Erro: ${error.message}. Verifique se o servidor está online.`);
            } finally {
                // Reabilita controles
                inputUsuario.disabled = false;
                sendButton.disabled = false;
                sendButton.textContent = 'Enviar';
                inputUsuario.focus();
            }
        }

        // Exibir mensagem do usuário
        function exibirMensagemUsuario(mensagem) {
            const chatContainer = document.getElementById('chat-container');
            const mensagemDiv = document.createElement('div');
            mensagemDiv.className = 'mensagem usuario';
            mensagemDiv.innerHTML = `
                <div class="conteudo-mensagem">
                    <strong>Você:</strong>
                    ${escapeHtml(mensagem)}
                </div>
                <div class="timestamp">${new Date().toLocaleTimeString('pt-BR')}</div>
            `;
            chatContainer.appendChild(mensagemDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Exibir mensagem do bot
        function exibirMensagemBot(mensagem) {
            const chatContainer = document.getElementById('chat-container');
            const mensagemDiv = document.createElement('div');
            mensagemDiv.className = 'mensagem bot';
            mensagemDiv.innerHTML = `
                <div class="conteudo-mensagem">
                    <strong>Bot:</strong>
                    ${escapeHtml(mensagem)}
                </div>
                <div class="timestamp">${new Date().toLocaleTimeString('pt-BR')}</div>
            `;
            chatContainer.appendChild(mensagemDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Limpar chat
        function limparChat() {
            // Salva histórico atual se houver mensagens
            if (chatHistory.length > 0) {
                salvarHistoricoSessao(
                    currentSessionId, 
                    "chatbotPrincipalIFCODE", 
                    chatStartTime, 
                    new Date(), 
                    chatHistory
                );
            }

            // Limpa interface
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = `
                <div class="welcome-message">
                    <h3>Nova conversa iniciada!</h3>
                    <p>Como posso ajudá-lo hoje?</p>
                </div>
            `;

            // Reinicia variáveis
            chatHistory = [];
            currentSessionId = `sessao_${Date.now()}_${Math.random().toString(36).substring(7)}`;
            chatStartTime = new Date();
            messageCount = 0;

            console.log(`🔄 Nova sessão: ${currentSessionId}`);
            
            // Mensagem de boas-vindas do bot
            setTimeout(() => {
                exibirMensagemBot('Olá! Como posso ajudá-lo hoje?');
            }, 500);
        }

        // Salvar histórico manualmente
        async function salvarHistoricoManual() {
            if (chatHistory.length === 0) {
                alert('Nenhum histórico para salvar!');
                return;
            }

            await salvarHistoricoSessao(
                currentSessionId, 
                "chatbotPrincipalIFCODE", 
                chatStartTime, 
                new Date(), 
                chatHistory
            );
            
            alert(`Histórico salvo! Session: ${currentSessionId.substring(0, 20)}...`);
            carregarHistoricos();
        }

        // Carregar históricos do backend
        async function carregarHistoricos() {
            const listaSessoes = document.getElementById('lista-sessoes');
            listaSessoes.innerHTML = '<li class="loading">Carregando...</li>';

            try {
                const response = await fetch(`${backendUrl}/api/chat/historicos`);
                const data = await response.json();
                
                listaSessoes.innerHTML = '';
                
                if (!data.sessoes || data.sessoes.length === 0) {
                    listaSessoes.innerHTML = '<li style="text-align:center; color:#666; padding:20px;">Nenhum histórico encontrado</li>';
                    return;
                }

                data.sessoes.forEach(sessao => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div style="font-weight: bold; margin-bottom: 5px;">
                            ${sessao.sessionId.substring(0, 25)}...
                        </div>
                        <div style="font-size: 0.85rem; color: #666;">
                            📅 ${new Date(sessao.startTime).toLocaleDateString('pt-BR')} 
                            🕐 ${new Date(sessao.startTime).toLocaleTimeString('pt-BR')}
                        </div>
                        <div style="font-size: 0.8rem; color: #888; margin-top: 3px;">
                            💬 ${sessao.totalMessages} mensagens
                        </div>
                    `;
                    li.onclick = () => carregarDetalheSessao(sessao.sessionId, li);
                    listaSessoes.appendChild(li);
                });

            } catch (error) {
                console.error('Erro ao carregar históricos:', error);
                listaSessoes.innerHTML = '<li class="error">Erro ao carregar históricos</li>';
            }
        }

        // Carregar detalhes de uma sessão específica
        async function carregarDetalheSessao(sessionId, liElement) {
            // Remove classe active de outros elementos
            document.querySelectorAll('#lista-sessoes li').forEach(li => li.classList.remove('active'));
            liElement.classList.add('active');

            const detalheDiv = document.getElementById('visualizacao-conversa-detalhada');
            detalheDiv.innerHTML = '<p class="loading">Carregando conversa...</p>';

            try {
                const response = await fetch(`${backendUrl}/api/chat/historicos/${sessionId}`);
                const sessao = await response.json();

                if (!sessao.messages || sessao.messages.length === 0) {
                    detalheDiv.innerHTML = '<p class="error">Conversa sem mensagens</p>';
                    return;
                }

                let html = `
                    <div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #eee;">
                        <h4>${sessao.sessionId.substring(0, 30)}...</h4>
                        <p><strong>Início:</strong> ${new Date(sessao.startTime).toLocaleString('pt-BR')}</p>
                        <p><strong>Duração:</strong> ${sessao.estatisticas?.duracaoMinutos || 0} minutos</p>
                        <p><strong>Total:</strong> ${sessao.totalMessages} mensagens</p>
                    </div>
                    <div style="max-height: 300px; overflow-y: auto;">
                `;

                sessao.messages.forEach((msg, index) => {
                    const isUser = msg.role === 'user';
                    const content = msg.content || msg.parts?.[0]?.text || 'Mensagem vazia';
                    html += `
                        <div style="
                            margin-bottom: 10px; 
                            padding: 8px 12px; 
                            border-radius: 12px;
                            background: ${isUser ? '#e3f2fd' : '#f1f8e9'};
                            border-left: 3px solid ${isUser ? '#2196f3' : '#4caf50'};
                        ">
                            <strong>${isUser ? 'Você' : 'Bot'}:</strong>
                            <p style="margin: 5px 0 0 0; word-wrap: break-word;">${escapeHtml(content)}</p>
                        </div>
                    `;
                });

                html += '</div>';
                detalheDiv.innerHTML = html;

            } catch (error) {
                console.error('Erro ao carregar detalhes:', error);
                detalheDiv.innerHTML = '<p class="error">Erro ao carregar conversa</p>';
            }
        }

        // Função utilitária para escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Sistema iniciando...');

            // Verifica elementos essenciais
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const chatContainer = document.getElementById('chat-container');

            if (!userInput || !sendButton || !chatContainer) {
                console.error('❌ Elementos essenciais não encontrados!');
                document.body.innerHTML = '<div style="text-align:center;color:red;padding:50px;"><h2>Erro: Elementos HTML não encontrados!</h2></div>';
                return;
            }

            // Registra acesso
            registrarConexaoUsuario();

            // Event listener para Enter
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    enviarMensagem();
                }
            });

            // Event listener para botão enviar
            sendButton.addEventListener('click', function(e) {
                e.preventDefault();
                enviarMensagem();
            });

            // Salva histórico antes de sair
            window.addEventListener('beforeunload', function() {
                if (chatHistory.length > 0) {
                    const payload = JSON.stringify({
                        sessionId: currentSessionId,
                        botId: "chatbotPrincipalIFCODE",
                        startTime: chatStartTime.toISOString(),
                        endTime: new Date().toISOString(),
                        messages: chatHistory
                    });
                    
                    navigator.sendBeacon(`${backendUrl}/api/chat/salvar-historico`, payload);
                }
            });

            // Carrega históricos iniciais
            setTimeout(() => {
                carregarHistoricos();
                exibirMensagemBot('Olá! Como posso ajudá-lo hoje?');
            }, 1000);

            console.log(`🎯 Sistema pronto. Session: ${currentSessionId}`);
        });

        // Testa conexão com o backend
        async function testarConexao() {
            try {
                const response = await fetch(`${backendUrl}/api/status`);
                const data = await response.json();
                console.log('🔗 Status do servidor:', data);
                return true;
            } catch (error) {
                console.error('❌ Servidor offline:', error);
                return false;
            }
        }

        // Testa conexão ao carregar
        window.addEventListener('load', () => {
            testarConexao().then(online => {
                if (!online) {
                    document.getElementById('chat-container').innerHTML += 
                        '<div class="error" style="margin: 10px;">⚠️ Servidor offline. Algumas funcionalidades podem não funcionar.</div>';
                }
            });
        });
    </script>
</body>
</html>
